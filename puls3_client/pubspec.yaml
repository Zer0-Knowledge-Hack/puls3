name: puls3_client
description: >-
  The puls3 API client generated by Serverpod from puls3_server. Use it through
  puls3_sdk; its version follows the server it was generated from.
version: 0.1.0
repository: https://github.com/Zer0-Knowledge-Hack/puls3/tree/main/puls3_client
issue_tracker: https://github.com/Zer0-Knowledge-Hack/puls3/issues
topics: [serverpod, stellar]

environment:
  sdk: '^3.12.2'

resolution: workspace

# Exact versions, as Serverpod's own client packages pin them: the generated
# protocol must match the Serverpod version of the server (docs/sdk/releasing.md).
# The generated code imports every package below, so each one is declared
# here: a transitive one works in the workspace but not on pub.dev.
dependencies:
  http: ^1.6.0
  serverpod_auth_core_client: 4.1.2
  serverpod_auth_idp_client: 4.1.2
  serverpod_client: 4.1.2
