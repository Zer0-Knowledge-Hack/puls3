name: Task
description: A unit of work with objective deliverables and acceptance criteria.
body:
  - type: markdown
    attributes:
      value: |
        Every field is required. Before creating the issue, add exactly one `area:` label, one `type:` label, one priority (`P0`/`P1`/`P2`), and a milestone. See [CONTRIBUTING.md](https://github.com/Zer0-Knowledge-Hack/puls3/blob/main/CONTRIBUTING.md#31-issues).
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this work is needed and what it unblocks.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: The files, features, or decisions this issue produces. Name exact paths when you know them.
      placeholder: |
        1. `docs/example.md` with ...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Objective checks a reviewer can tick one by one.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: how-to-verify
    attributes:
      label: How to verify
      description: Commands or steps the reviewer runs to confirm the acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue does not cover, with links to the issues that do.
    validations:
      required: true
  - type: textarea
    id: depends-on
    attributes:
      label: Depends on
      description: Issues that must be done first. Write "None." if there are none.
    validations:
      required: true
