name: E2E sandbox

# Follow-up #298 of #255, #256 and #290. The server E2E suites run the hire
# journey against the local Soroban sandbox (#253), so a change that breaks it
# fails here instead of merging green.
#
# Required since #371: ci.yml calls this workflow as its `e2e` job, behind the
# `changes` path filter, and the `gate` job waits for it. It cannot keep its own
# push and pull_request triggers: a path-filtered workflow that does not run
# never reports, so a required check on it would hang on every docs-only PR.
# Stability evidence behind the promotion: 16 completed runs, 0 failures
# (2026-11-17 to 2026-11-20), 3.5 to 4.5 minutes each.
#
# The Flutter browser suite (#256) is a separate job later: it adds Chrome and
# chromedriver, and a flaky browser must not hide a server failure.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: {flutter-version: '3.44.4', cache: true}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add wasm32v1-none
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: contracts -> target
      - name: Install Stellar CLI
        env:
          STELLAR_SHA256: 207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc
        run: |
          archive="$RUNNER_TEMP/stellar.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$STELLAR_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install workspace and Melos
        run: |
          flutter pub get --enforce-lockfile
          dart pub global activate melos 8.10.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Generate throwaway local secrets
        run: bash scripts/setup-local-secrets.sh
      - name: Start the sandbox, Postgres and Redis
        # The quickstart image is pinned by digest in docker-compose.yaml.
        run: |
          docker compose -f puls3_server/docker-compose.yaml up -d --wait --wait-timeout 300 \
            soroban_standalone postgres_test redis_test
      - name: Deploy the contracts on the sandbox
        run: bash scripts/setup-local-soroban.sh
      - name: Run the server E2E suites
        run: melos run test:e2e
      - name: Show sandbox logs on failure
        if: failure()
        run: docker compose -f puls3_server/docker-compose.yaml logs --tail 200 soroban_standalone
      - name: Stop the sandbox
        if: always()
        run: docker compose -f puls3_server/docker-compose.yaml down -v
