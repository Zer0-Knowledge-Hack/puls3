name: E2E sandbox

# Follow-up #298 of #255, #256 and #290. The server E2E suites run the hire
# journey against the local Soroban sandbox (#253), so a change that breaks it
# fails here instead of merging green.
#
# Required since #371: ci.yml calls this workflow as its `e2e` job, behind the
# `changes` path filter, and the `gate` job waits for it. It cannot keep its own
# push and pull_request triggers: a path-filtered workflow that does not run
# never reports, so a required check on it would hang on every docs-only PR.
# Stability evidence behind the promotion: 16 completed runs, 0 failures
# (2026-11-17 to 2026-11-20), 3.5 to 4.5 minutes each.
#
# The Flutter browser suite (#256) runs in its own workflow, e2e-browser.yml
# (#372): it adds Chrome and chromedriver, and a flaky browser must not hide a
# server failure.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-soroban
      - name: Install Melos
        run: |
          dart pub global activate melos 8.10.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/start-sandbox
      - name: Run the server E2E suites
        run: melos run test:e2e
      - name: Show sandbox logs on failure
        if: failure()
        run: docker compose -f puls3_server/docker-compose.yaml logs --tail 200 soroban_standalone
      - name: Stop the sandbox
        if: always()
        run: docker compose -f puls3_server/docker-compose.yaml down -v
