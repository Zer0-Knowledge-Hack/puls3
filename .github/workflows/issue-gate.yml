name: Issue gate

# Prevents partial delivery against issues: a PR that says `Closes #N` must have
# every acceptance criterion of #N checked; partial work uses `Refs #N` and gets
# a sticky comment listing what remains. Rules: CONTRIBUTING.md, "Closes vs Refs".
# Logic and tests: .github/scripts/issue-gate.js. Make `Issue gate / gate` a
# required status check (repository admin).

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: issue-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A PR must not be able to edit the gate that judges it: run the script
      # from the base ref when it exists there. Only a PR that introduces the
      # gate (bootstrap) falls back to its own copy.
      - name: Check out base gate scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-gate
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Select gate scripts
        run: |
          if [ -f base-gate/.github/scripts/issue-gate.js ]; then
            echo "GATE_DIR=$GITHUB_WORKSPACE/base-gate/.github/scripts" >> "$GITHUB_ENV"
          else
            echo "::notice::Base ref has no issue gate yet; using the PR's own copy (bootstrap)."
            echo "GATE_DIR=$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_ENV"
          fi
      # The runner image ships Node 20+, so no setup action is needed.
      - name: Unit tests
        run: node --test "$GATE_DIR/issue-gate.test.js"
      - name: Check issue deliverables
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { evaluate, parseReferences, MARKER } = require(`${process.env.GATE_DIR}/issue-gate.js`);
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const { closes, refs } = parseReferences(pr.body);
            const issues = {};
            for (const n of [...closes, ...refs]) {
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: n });
                issues[n] = data.pull_request ? null : (data.body || '');
              } catch (e) {
                if (e.status !== 404) throw e;
                issues[n] = null;
              }
            }
            const files = (await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 })).map((f) => f.filename);

            const result = evaluate({
              body: pr.body,
              labels: pr.labels.map((l) => l.name),
              author: pr.user.login,
              files,
              issues,
            });
            for (const n of result.notices) core.notice(n);

            // One sticky comment, found by marker. Fork PRs get a read-only
            // token, so a failed write is a warning, never a gate failure.
            try {
              const comments = await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number: pr.number, per_page: 100 });
              const existing = comments.find((c) => c.body && c.body.includes(MARKER));
              if (result.comment && existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: result.comment });
              } else if (result.comment) {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: result.comment });
              } else if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
            } catch (e) {
              core.warning(`Could not update the sticky comment: ${e.message}`);
            }

            if (result.status === 'fail') {
              core.setFailed(result.failures.join('\n\n'));
            }
