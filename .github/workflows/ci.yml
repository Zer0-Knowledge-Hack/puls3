name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.paths.outputs.domain }}
      server: ${{ steps.paths.outputs.server }}
      app: ${{ steps.paths.outputs.app }}
      contracts: ${{ steps.paths.outputs.contracts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: paths
        name: Detect affected components
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          domain=false server=false app=false contracts=false
          while IFS= read -r path; do
            case "$path" in
              pubspec.yaml|pubspec.lock)
                domain=true; server=true; app=true ;;
              puls3_domain/*)
                domain=true; server=true ;;
              puls3_server/*)
                server=true ;;
              puls3_client/*)
                server=true; app=true ;;
              puls3_flutter/*)
                app=true ;;
              contracts/*)
                contracts=true ;;
              .github/workflows/ci.yml)
                domain=true; server=true; app=true; contracts=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"

  domain:
    needs: changes
    if: needs.changes.outputs.domain == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: {flutter-version: '3.41.4', cache: true}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - run: flutter pub get
      - working-directory: puls3_domain
        run: dart analyze --fatal-infos && dart test

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: postgres, POSTGRES_DB: puls3_test, POSTGRES_PASSWORD: ci_database_password}
        ports: ['9090:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d puls3_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:6.2.6
        ports: ['9091:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: {flutter-version: '3.41.4', cache: true}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - run: flutter pub get && dart pub global activate serverpod_cli 3.4.13
      - name: Configure test passwords
        shell: bash
        run: |
          cat > puls3_server/config/passwords.yaml <<'EOF'
          test:
            database: ci_database_password
            redis: ci_redis_password
            emailSecretHashPepper: ci_email_pepper
            jwtHmacSha512PrivateKey: ci_jwt_private_key
            jwtRefreshTokenHashPepper: ci_refresh_pepper
          EOF
      - working-directory: puls3_server
        run: dart analyze --fatal-infos && dart test && serverpod generate
      - run: git diff --exit-code -- puls3_server puls3_client

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: {flutter-version: '3.41.4', cache: true}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - run: flutter pub get
      - working-directory: puls3_flutter
        run: flutter analyze --fatal-infos && flutter test && flutter build web --release

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
          rustup target add wasm32v1-none
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: contracts -> target
      - name: Install Stellar CLI
        env:
          STELLAR_SHA256: 207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc
        run: |
          archive="$RUNNER_TEMP/stellar.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$STELLAR_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: stellar contract build

  gate:
    name: gate
    if: always()
    needs: [changes, domain, server, app, contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable component
        env:
          CHANGES: ${{ needs.changes.result }}
          DOMAIN: ${{ needs.domain.result }}
          SERVER: ${{ needs.server.result }}
          APP: ${{ needs.app.result }}
          CONTRACTS: ${{ needs.contracts.result }}
        run: |
          for result in "$CHANGES" "$DOMAIN" "$SERVER" "$APP" "$CONTRACTS"; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "A required CI job finished with: $result" >&2
              exit 1
            fi
          done
