name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.paths.outputs.domain }}
      server: ${{ steps.paths.outputs.server }}
      app: ${{ steps.paths.outputs.app }}
      contracts: ${{ steps.paths.outputs.contracts }}
      docker: ${{ steps.paths.outputs.docker }}
      sdk: ${{ steps.paths.outputs.sdk }}
      e2e: ${{ steps.paths.outputs.e2e }}
      migrations: ${{ steps.paths.outputs.migrations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: paths
        name: Detect affected components
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          domain=false server=false app=false contracts=false docker=false sdk=false e2e=false migrations=false
          while IFS= read -r path; do
            case "$path" in
              pubspec.yaml|pubspec.lock)
                domain=true; server=true; app=true; docker=true; sdk=true; e2e=true ;;
              puls3_domain/*)
                domain=true; server=true; docker=true; e2e=true ;;
              docs/architecture/examples/*)
                domain=true ;;
              puls3_server/*)
                server=true; docker=true; e2e=true ;;
              .dockerignore)
                docker=true ;;
              # The server image resolves puls3_client and puls3_sdk as dev
              # dependencies, and the server job runs the SDK contract tests
              # (#375), so both jobs follow these packages.
              puls3_client/*)
                server=true; app=true; sdk=true; docker=true; e2e=true ;;
              puls3_sdk/*)
                server=true; sdk=true; docker=true ;;
              puls3_mcp/*)
                server=true; sdk=true ;;
              puls3_cli/*)
                sdk=true ;;
              puls3_flutter/*)
                app=true ;;
              contracts/*)
                contracts=true; e2e=true ;;
              scripts/setup-local-soroban.sh|scripts/setup-local-secrets.sh|.github/workflows/e2e.yml)
                e2e=true ;;
              .github/workflows/ci.yml)
                domain=true; server=true; app=true; contracts=true; docker=true; sdk=true; e2e=true ;;
            esac
            case "$path" in
              puls3_server/migrations/*|puls3_server/*.spy.yaml|scripts/check-migrations.sh|.github/workflows/ci.yml)
                migrations=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"

  domain:
    needs: changes
    if: needs.changes.outputs.domain == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: {flutter-version: '3.44.4', cache: true}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - run: flutter pub get --enforce-lockfile
      - working-directory: puls3_domain
        run: dart analyze --fatal-infos && dart test

  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: {flutter-version: '3.44.4', cache: true}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - run: flutter pub get --enforce-lockfile
      - working-directory: puls3_sdk
        run: dart analyze --fatal-infos && dart test
      # Both packages stay publishable on pub.dev (#300, docs/sdk/releasing.md).
      - name: puls3_sdk passes the pub.dev checks
        working-directory: puls3_sdk
        run: dart pub publish --dry-run
      - name: puls3_client passes the pub.dev checks (warnings allowed)
        working-directory: puls3_client
        # The exact Serverpod pins are warnings that make --dry-run exit 65 on
        # purpose, so only validation errors fail the step.
        run: |
          out="$(dart pub publish --dry-run 2>&1 || true)"
          echo "$out"
          if grep -qE 'found the following( [0-9]+)? errors?:' <<<"$out"; then exit 1; fi
      - working-directory: puls3_cli
        run: dart analyze --fatal-infos && dart test
      - working-directory: puls3_mcp
        run: dart analyze --fatal-infos && dart test

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: postgres, POSTGRES_DB: puls3_test, POSTGRES_PASSWORD: ci_database_password}
        ports: ['9090:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d puls3_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:6.2.6
        ports: ['9091:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: {flutter-version: '3.44.4', cache: true}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - run: flutter pub get --enforce-lockfile && dart pub global activate serverpod_cli 4.0.4
      - name: Configure test passwords
        shell: bash
        run: |
          cat > puls3_server/config/passwords.yaml <<'EOF'
          test:
            database: ci_database_password
            redis: ci_redis_password
            emailSecretHashPepper: ci_email_pepper
            jwtHmacSha512PrivateKey: ci_jwt_private_key
            jwtRefreshTokenHashPepper: ci_refresh_pepper
          EOF
      - working-directory: puls3_server
        run: dart analyze --fatal-infos && dart test && serverpod generate
      - run: git diff --exit-code -- puls3_server puls3_client
      - name: Check migrations (fresh vs upgraded schema, no pending migration)
        if: needs.changes.outputs.migrations == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PGHOST: localhost
          PGPORT: '9090'
          PGUSER: postgres
          PGPASSWORD: ci_database_password
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          scripts/check-migrations.sh "$BASE_SHA"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: {flutter-version: '3.44.4', cache: true}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - run: flutter pub get --enforce-lockfile
      - working-directory: puls3_flutter
        run: flutter analyze --fatal-infos && flutter test && flutter build web --release

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Plant local secret files that the build context must exclude
        run: |
          touch puls3_server/.env puls3_server/config/passwords.yaml
      - name: Build server image
        run: docker build --file puls3_server/Dockerfile --tag puls3-server:ci .
      - name: Check runtime bundle and secret exclusion
        run: |
          docker run --rm --entrypoint sh puls3-server:ci -c '
            test -x server/bin/main &&
            test -f config/production.yaml &&
            test ! -e config/passwords.yaml'

  scripts:
    # Offline tests for scripts/*.sh and the env inventory (no network, no real
    # Stellar CLI). They read code, docs and config across the repository, so
    # they run on every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run script tests
        shell: bash
        run: |
          status=0
          for test in scripts/tests/*.test.sh; do
            echo "::group::$test"
            bash "$test" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
          rustup target add wasm32v1-none
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: contracts -> target
      - name: Install Stellar CLI
        env:
          STELLAR_SHA256: 207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc
        run: |
          archive="$RUNNER_TEMP/stellar.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$STELLAR_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # The RustSec audit lives in contracts-audit.yml (#281), so a new advisory
      # never hides the results below. This check is deterministic: the
      # crypto-bigint ignore in .cargo/audit.toml only holds while the wasm
      # graph stays free of it.
      - name: Keep ignored advisory crates out of the wasm graph
        run: |
          # List the whole wasm graph instead of querying one version: a
          # version-pinned `cargo tree -i` fails when the lock moves to another
          # version, and that failure must never read as "not in the graph".
          # A cargo failure here fails the step (bash -e) with its stderr shown.
          tree="$(cargo tree --workspace -e normal --target wasm32v1-none --prefix none)"
          if matches="$(grep -E '^(crypto-bigint|paste) ' <<<"$tree")"; then
            echo "$matches" >&2
            echo "An ignored crate reached the wasm graph: the RUSTSEC-2026-0387 / RUSTSEC-2024-0436 ignores in contracts/.cargo/audit.toml no longer hold." >&2
            exit 1
          fi
      - run: cargo test
      - run: stellar contract build

  # The server E2E suites against the Soroban sandbox (#298), required since #371.
  # It runs only when its inputs change, like every other component, so a docs-only
  # or Flutter-only PR neither runs nor waits for it.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml

  gate:
    name: gate
    if: always()
    needs: [changes, domain, sdk, server, app, docker, scripts, contracts, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable component
        env:
          CHANGES: ${{ needs.changes.result }}
          DOMAIN: ${{ needs.domain.result }}
          SDK: ${{ needs.sdk.result }}
          SERVER: ${{ needs.server.result }}
          APP: ${{ needs.app.result }}
          DOCKER: ${{ needs.docker.result }}
          SCRIPTS: ${{ needs.scripts.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          for result in "$CHANGES" "$DOMAIN" "$SDK" "$SERVER" "$APP" "$DOCKER" "$SCRIPTS" "$CONTRACTS" "$E2E"; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "A required CI job finished with: $result" >&2
              exit 1
            fi
          done
