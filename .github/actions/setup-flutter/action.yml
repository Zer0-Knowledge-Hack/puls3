name: Set up Flutter workspace
description: >-
  Install the pinned Flutter SDK, restore the pub cache and resolve the
  workspace with --enforce-lockfile. The caller checks out the repository first.

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with: {flutter-version: '3.44.4', cache: true}
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
        restore-keys: ${{ runner.os }}-pub-
    - name: Resolve the workspace
      shell: bash
      run: flutter pub get --enforce-lockfile
