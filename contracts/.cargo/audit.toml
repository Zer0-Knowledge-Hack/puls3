# cargo-audit configuration for the Soroban workspace (audit P-1, #206).
# Every ignore needs a reason and a way out. Remove it once the way out lands.
# The ignores below are tracked in #295 (bump soroban-sdk).

[advisories]
ignore = [
  # RUSTSEC-2026-0387: crypto-bigint 0.5.5, timing variability in operations
  # meant to be constant-time. It reaches this workspace only through
  # soroban-env-host 28 (k256 / p256 -> elliptic-curve 0.13), the native host
  # that `cargo test` and the SDK testutils run. It is not in the contracts
  # we deploy: `cargo tree -i crypto-bigint@0.5.5 -e normal --target
  # wasm32v1-none` prints nothing. The patched release (>= 0.7.6) needs
  # elliptic-curve 0.14, which only a soroban-env-host / soroban-sdk upgrade
  # can bring. Way out: drop this line when soroban-sdk moves to it. CI keeps
  # the wasm-graph claim true (`contracts` job, #281).
  "RUSTSEC-2026-0387",
  # RUSTSEC-2024-0436: paste 1.0.15, no longer maintained (a warning, so
  # `cargo audit --deny warnings` fails on it). It is a proc-macro pulled by
  # ark-ff 0.5 through soroban-env-host 28, host-only like the entry above,
  # and absent from the wasm graph. No fixed release exists. Way out: drop
  # this line when soroban-env-host stops depending on it. CI keeps the
  # wasm-graph claim true (`contracts` job, #281).
  "RUSTSEC-2024-0436",
  # RUSTSEC-2026-0543: chrono 0.4.45, no longer maintained (a warning). It is
  # in Cargo.lock only as an optional dependency of serde_with 3.23 (reached
  # through soroban-ledger-snapshot, the SDK's test snapshots), whose `chrono`
  # feature nothing enables, so it is never compiled, for any target:
  # `cargo tree -i chrono --target all -e all` prints nothing. Way out: drop
  # this line when serde_with or the soroban-sdk bump (#295) stops listing it.
  "RUSTSEC-2026-0543",
]
