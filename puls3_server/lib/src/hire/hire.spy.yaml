class: HireRecord
table: hire
serverOnly: true
fields:
  consumer: String
  agentId: int
  price: int
  manifestVersion: int
  expiredAt: int
  ### Client idempotency key; null for rows that predate it.
  requestId: String?
  ### The hire input text; null for rows that predate it.
  input: String?
  ### Escrow job id, bound once when the create_job is confirmed.
  jobId: int?
  ### StrKey of the escrow contract that holds jobId, bound with it (#273).
  ### Null for a hire that predates the column and for a hire without a job:
  ### it then means the escrow configured at that moment (#307).
  escrow: String?
  ### USDC stroops the consumer funds beside price for child jobs
  ### (fund_with_reserve, ADR-0011 D1). 0, the default of existing rows, is a
  ### hire that never subcontracts and is funded with fund.
  subcontractReserve: int, default=0
  ### Whether the agent may subcontract an agent of the same owner (ADR-0011
  ### D10). Allowed by default, with notice.
  allowRelatedParty: bool, default=true
  ### The hire whose reserve funded this child hire (ADR-0011 D7). Null for a
  ### consumer's hire.
  parentHireId: int?
indexes:
  hire_consumer_request_idx:
    fields: consumer, requestId
    unique: true
  hire_job_id_idx:
    fields: jobId
    unique: true
  hire_parent_idx:
    fields: parentHireId
