# and rewrites this file without these puls3 comments; commit the result.
# The pre-deploy script runs locally before each upload and sets PULS3_GIT_SHA
# to the deployed commit (tool/set_deploy_sha.dart).
#
# Useful commands:
# - Deploy: `scloud deploy`
# - Get Help: `scloud help`
#
# For full documentation, visit: https://docs.serverpod.dev/cloud

project:
  projectId: "REPLACE_WITH_PROJECT_ID"
  scripts:
    pre_deploy:
      - "dart run tool/set_deploy_sha.dart"
    post_deploy: []
